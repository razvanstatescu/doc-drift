modules:
  confluence:contentBylineItem:
    # State comes from the page content property, so page views run no function (S2).
    # The manifest icon renders; an icon set through the property does not (live test 2026-11-11),
    # so the state lives in the title ("Doc Drift: Possibly stale") and the tooltip.
    - key: dds-byline
      resource: byline
      render: native
      resolver:
        function: byline-resolver
      viewportContainer: modal
      viewportSize: large
      # State-neutral: the modal's top bar shows this title. The page byline gets its state title
      # ("Doc Drift: Possibly stale") from the content property.
      title: Doc Drift
      tooltip: Not linked to code or Jira. Add anchors.
      icon: resource:icons;doc-drift.svg
      contentPropertyKey: dds-byline-7f3c2a
  confluence:globalSettings:
    - key: dds-settings
      resource: settings
      render: native
      resolver:
        function: settings-resolver
      title: Doc Drift Sentinel
      useAsConfig: true
  confluence:spacePage:
    # Space dashboard (F8). Resolver getSpaceDashboard({spaceKey}); spaceKey comes from the module context.
    - key: dds-dashboard
      resource: dashboard
      render: native
      resolver:
        function: byline-resolver
      title: Drift dashboard
      route: drift-dashboard
      icon: resource:icons;doc-drift.svg
  sql:
    - key: main
      engine: mysql
  trigger:
    - key: dds-migration-trigger
      function: enqueue-migration
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
    # Jira (optional app): anchored issues. Filter on changelog fieldId only; string methods in list
    # callbacks fail deploy on complexity. The handler re-checks the fields (RECEIVE_AND_LOG).
    - key: dds-jira-updated
      function: jira-event
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
        expression: >-
          event.changelog.items.some(i => ['status', 'resolution', 'fixVersions', 'components',
          'description', 'summary', 'parent', 'IssueParentAssociation'].includes(i.fieldId))
        onError: RECEIVE_AND_LOG
    - key: dds-jira-deleted
      function: jira-event
      events:
        - avi:jira:deleted:issue
      filter:
        ignoreSelf: true
    # A trashed or deleted page closes its events and drops its bindings. `ignoreSelf` is Jira-only,
    # so the handler drops selfGenerated events itself.
    - key: dds-page-removed
      function: confluence-page-event
      events:
        - avi:confluence:trashed:page
        - avi:confluence:deleted:page
  scheduledTrigger:
    # D27: Possibly stale to Stale after escalationDays; also rewrites bylines whose snooze ended.
    - key: dds-escalation
      function: escalate
      interval: hour
  consumer:
    - key: dds-migration-consumer
      queue: dds-migration-queue
      function: run-migration
    - key: dds-match-consumer
      queue: match-queue
      function: match
    # Footer-comment notifier. Jobs carry a page ID only, pushed with delayInSeconds (debounce).
    - key: dds-notify-consumer
      queue: notify-queue
      function: notify
  webtrigger:
    # The relay POSTs HMAC-signed change records here. Static response keeps Runs on Atlassian eligibility.
    - key: ingest-change
      function: ingest
      urlFormat: v2
      response:
        type: static
        outputs:
          - key: accepted
            statusCode: 202
            contentType: application/json
            body: '{"status":"accepted"}'
          - key: bad-request
            statusCode: 400
            contentType: application/json
            body: '{"status":"bad_request"}'
          - key: unauthorized
            statusCode: 401
            contentType: application/json
            body: '{"status":"unauthorized"}'
    # Development-only driver for end-to-end checks. Inert unless DDS_DEV_TOKEN is set. Remove in M4.
    - key: dds-dev
      function: dev-driver
      urlFormat: v2
      response:
        type: static
        outputs:
          - key: accepted
            statusCode: 202
            contentType: application/json
            body: '{"status":"accepted"}'
          - key: bad-request
            statusCode: 400
            contentType: application/json
            body: '{"status":"bad_request"}'
          - key: unauthorized
            statusCode: 401
            contentType: application/json
            body: '{"status":"unauthorized"}'
          - key: failed
            statusCode: 500
            contentType: application/json
            body: '{"status":"failed"}'
  function:
    - key: byline-resolver
      handler: index.bylineHandler
    - key: settings-resolver
      handler: index.settingsHandler
    - key: ingest
      handler: index.ingest
    - key: match
      handler: index.match
      timeoutSeconds: 120
    - key: enqueue-migration
      handler: index.enqueueMigration
    - key: run-migration
      handler: index.runMigration
      timeoutSeconds: 900
    - key: notify
      handler: index.notify
      timeoutSeconds: 60
    - key: jira-event
      handler: index.jiraEvent
    - key: confluence-page-event
      handler: index.confluencePageEvent
    - key: escalate
      handler: index.escalate
      timeoutSeconds: 300
    - key: dev-driver
      handler: index.devDriver
resources:
  - key: byline
    path: src/frontend/byline/index.jsx
  - key: settings
    path: src/frontend/settings/index.jsx
  - key: dashboard
    path: src/frontend/dashboard/index.jsx
  - key: icons
    path: static/icons
permissions:
  scopes:
    # Pages, page operations and content properties (REST v2). write:page is required for property writes.
    - read:page:confluence
    - write:page:confluence
    # Current user with operations (admin check on the settings page).
    - read:confluence-user
    # KVS settings and the relay secret.
    - storage:app
    # M2. Notifier footer comments (POST/PUT /footer-comments).
    - write:comment:confluence
    # M2. Dashboard: space ID by key (GET /spaces?keys=).
    - read:space:confluence
    # M2. Page trashed/deleted events (the trashed and deleted events also need write:confluence-content).
    - read:confluence-content.summary
    - write:confluence-content
    # M2. Jira trigger and GET /rest/api/3/issue/{key}.
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/12e968a1-a45d-4524-ba28-d47e2315db1a
  compatibility:
    confluence:
      required: true
    jira:
      required: false
