<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;

    color: #f2f6f7; font-family: 'Spline Sans', sans-serif; -webkit-font-smoothing: antialiased;
  }
  .tide { position: absolute; inset: 0; width: 100%; height: 100%; color: #22717e; opacity: 0.55; }

  .badge {
    position: absolute; right: 80px; bottom: 80px; display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-radius: 8px; background: #ffb224; color: #072630; font-size: 22px; font-weight: 600;
    box-shadow: 0 0 0 1px #ffb22459, 0 8px 32px #ffb22440;
  }
  .badge svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; }
  .trace { position: absolute; right: 80px; bottom: 80px; width: 210px; height: 50px; border-radius: 8px; background: #ffffff12; transform: translateX(-24px); }
</style>
</head>
